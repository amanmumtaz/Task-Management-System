<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header class="header">
        <div class="header-content">
            <div class="logo">✓</div>
            <div>
                <h1>Task Manager</h1>
                <p>Organize your homework, assignments and study goals.</p>
            </div>
        </div>

        <div class="theme-control">
            <span>☾</span>
            <button id="themeBtn" class="theme-toggle"
                type="button" aria-label="Toggle dark mode"
                aria-pressed="false">
                <span class="toggle-thumb"></span>
            </button>
            <span>☀</span>
        </div>
    </header>

    <section class="stats">
        <div class="stat-card total-card">
            <div class="stat-icon">▤</div>
            <div>
                <h3>Total Tasks</h3>
                <p id="total">0</p>
            </div>
        </div>

        <div class="stat-card completed-card">
            <div class="stat-icon">✓</div>
            <div>
                <h3>Completed</h3>
                <p id="completed">0</p>
            </div>
        </div>

        <div class="stat-card pending-card">
            <div class="stat-icon">◷</div>
            <div>
                <h3>Pending</h3>
                <p id="pending">0</p>
            </div>
        </div>
    </section>

    <section class="form-section">
        <h2><span class="plus-icon">＋</span> Add a New Task</h2>

        <form id="taskForm">
            <div class="form-grid">
                <div class="field task-name-field">
                    <label for="taskName">Task Name *</label>
                    <input type="text" id="taskName"
                        placeholder="Enter task name..." maxlength="120" required>
                </div>

                <div class="field">
                    <label for="dueDate">Due Date</label>
                    <input type="date" id="dueDate">
                </div>

                <div class="field">
                    <label for="priority">Priority</label>
                    <select id="priority">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>

                <div class="field">
                    <label for="category">Category</label>
                    <select id="category">
                        <option>Homework</option>
                        <option>Assignment</option>
                        <option>Exam</option>
                        <option>Personal</option>
                    </select>
                </div>

                <button type="submit" id="addBtn" class="add-button">
                    ＋ Add Task
                </button>
            </div>
        </form>
    </section>

    <section class="tasks-section">
        <div class="toolbar">
            <input type="search" id="search"
                placeholder="⌕  Search tasks by name..."
                aria-label="Search tasks by name">

            <div class="filters">
                <button type="button" class="filter-btn active"
                    data-status="All">All</button>
                <button type="button" class="filter-btn"
                    data-status="Completed">✓ Completed</button>
                <button type="button" class="filter-btn"
                    data-status="Pending">◷ Pending</button>
            </div>

            <div class="sort-control">
                <label for="sort">Sort by:</label>
                <select id="sort">
                    <option value="created">Recently Added</option>
                    <option value="dueDate">Due Date</option>
                    <option value="priority">Priority</option>
                </select>
            </div>
        </div>

        <div id="taskList"></div>

        <div id="emptyState" class="empty-state">
            <div>✦</div>
            <h3>No tasks found</h3>
            <p>Add a task or change your search and filters.</p>
        </div>

        <div class="list-footer">
            <span id="taskCount">Showing 0 tasks</span>
            <span>⠿ Drag and drop to reorder tasks</span>
        </div>
    </section>

    <footer>Made for better study habits ♡</footer>

</div>

<script src="script.js"></script>
</body>
</html>
